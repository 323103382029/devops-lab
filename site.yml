
---
- name: Configure TradeLive VM
  hosts: tradelive
  become: yes

  tasks:
    - name: Install the Google Authenticator PAM module
      apt:
        name: libpam-google-authenticator
        state: present
        update_cache: yes

    - name: Ensure SSH service is running
      service:
        name: ssh
        state: started
        enabled: yes

    - name: Install a sudoers policy for the developers group
      copy:
        dest: /etc/sudoers.d/developers
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
        content: |
          Cmnd_Alias SERVICE_CMDS = /usr/bin/systemctl status ssh, \
          /usr/bin/systemctl restart ssh
          Cmnd_Alias PKG_CMDS = /usr/bin/apt update
          %developers ALL=(ALL) NOPASSWD: SERVICE_CMDS, PKG_CMDS

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted

